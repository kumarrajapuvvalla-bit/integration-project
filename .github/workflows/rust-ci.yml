name: Rust CI

on:
  pull_request:
    paths:
      - 'tools/**'
  push:
    branches:
      - main
    paths:
      - 'tools/**'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: Build & Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/log-parser

    strategy:
      matrix:
        rust: [stable, beta]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/log-parser/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/log-parser/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: cargo test --all -- --nocapture

      - name: Print binary size
        run: |
          ls -lh target/release/log-parser
          echo "Binary size: $(du -sh target/release/log-parser | cut -f1)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: log-parser-${{ matrix.rust }}
          path: tools/log-parser/target/release/log-parser
          retention-days: 7

  security:
    name: cargo-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/log-parser
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit
        run: cargo audit
