name: Integration Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # Daily 06:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  integration:
    name: Integration Test Suite
    runs-on: ubuntu-latest
    # No services: block — we start the app directly in a step below
    # so the process has our dependencies available

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: services/flight-ingest
        run: pip install -r requirements.txt uvicorn httpx pytest --quiet

      - name: Start flight-ingest
        working-directory: services/flight-ingest
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8080 &
          sleep 4
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/healthz

      - name: Run integration tests
        working-directory: services/flight-ingest
        env:
          BASE_URL: http://localhost:8080
        run: pytest tests/integration/ -v --tb=short --junitxml=test-results.xml

      - name: Run Rust log-parser on CI output
        working-directory: tools/log-parser
        run: |
          cargo build --release --quiet
          echo 'ERROR: something failed' | ./target/release/log-parser --stdin --format json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: services/flight-ingest/test-results.xml
          retention-days: 14
