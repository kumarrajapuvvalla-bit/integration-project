# ── Image ──────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/kumarrajapuvvalla-bit/flight-ingest
  tag: latest
  pullPolicy: IfNotPresent

# ── Replicas ────────────────────────────────────────────────────────────────
replicaCount: 2

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── HPA ────────────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── PodDisruptionBudget ──────────────────────────────────────────────────────
pdb:
  enabled: true
  minAvailable: 1

# ── Probes ───────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

# ── ServiceMonitor (Prometheus Operator) ────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# ── Security context ─────────────────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
